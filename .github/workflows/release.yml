name: release

on:
  push:
    tags: ["v*"]
  # Lets the whole pipeline be rehearsed on a branch before a tag is cut, so
  # a broken workflow can't produce a bad public release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v), e.g. 1.0.1-beta.2"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The single source of truth for the release version is pubspec.yaml. Fail
  # here rather than shipping a release whose tag and build disagree.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "Resolved version: $VERSION"

          PUB_VERSION=$(grep -m1 '^version:' audio_relay_flutter/pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | sed -E 's/\+.*//')
          echo "pubspec.yaml:     $PUB_VERSION"

          if [ "$PUB_VERSION" != "$VERSION" ]; then
            echo "::error::Version mismatch. Tag says $VERSION, pubspec.yaml says $PUB_VERSION."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build-android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APK and AAB
        working-directory: audio_relay_flutter
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Package
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p dist
          cp audio_relay_flutter/build/app/outputs/flutter-apk/app-release.apk "dist/audio-relay-${VERSION}.apk"
          cp audio_relay_flutter/build/app/outputs/bundle/release/app-release.aab "dist/audio-relay-${VERSION}.aab"
          (cd dist && sha256sum ./*.apk ./*.aab > "audio-relay-${VERSION}-android.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            dist/*.apk
            dist/*.aab
            dist/*.sha256
          if-no-files-found: error

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Build
        working-directory: audio_relay_flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build windows --release
          # Bundle the standalone adb tooling so USB/ADB relay works out of the box.
          curl -sL https://dl.google.com/android/repository/platform-tools-latest-windows.zip -o platform-tools.zip
          powershell -Command "Expand-Archive -Path 'platform-tools.zip' -DestinationPath 'temp_pt' -Force"
          cp temp_pt/platform-tools/adb.exe build/windows/x64/runner/Release/
          cp temp_pt/platform-tools/AdbWinApi.dll build/windows/x64/runner/Release/
          cp temp_pt/platform-tools/AdbWinUsbApi.dll build/windows/x64/runner/Release/
          powershell -Command "Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath 'audio-relay-windows.zip' -Force"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p dist
          cp audio_relay_flutter/audio-relay-windows.zip "dist/audio-relay-${VERSION}-windows-x86_64.zip"
          (cd dist && sha256sum ./*.zip > "audio-relay-${VERSION}-windows.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  build-macos:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - name: Build
        working-directory: audio_relay_flutter
        run: flutter build macos --release
      - name: Package
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p dist
          APP="audio_relay_flutter/build/macos/Build/Products/Release/audio_relay_flutter.app"
          ditto -c -k --keepParent "$APP" "dist/audio-relay-${VERSION}-macos.zip"
          (cd dist && shasum -a 256 ./*.zip > "audio-relay-${VERSION}-macos.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: [version, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    # A dispatch run rehearses the builds but must not publish anything.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect artifacts and notes
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          (cd dist && cat ./*.sha256 | sed 's|\./||' | sort -k2 > SHA256SUMS.txt && rm -f ./*.sha256)

          awk '/^## \[Unreleased\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md for details." > notes.md
          fi
          {
            echo
            echo "---"
            echo
            echo "**Windows:** portable \`.exe\` inside the zip — no installer, no admin rights."
            echo
            echo "**macOS:** \`.app\` inside the zip — first run may require System Settings > Privacy & Security > Screen Recording."
            echo
            echo "**Android:** install the \`.apk\` directly; the \`.aab\` is for Play Store submission."
          } >> notes.md
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
