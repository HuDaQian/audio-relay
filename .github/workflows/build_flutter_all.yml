name: Build All Platforms (Audio Relay Flutter)

on:
  workflow_dispatch:
  push:
    paths:
      - 'audio_relay_flutter/**'
      - '.github/workflows/build_flutter_all.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build Android APK
        working-directory: audio_relay_flutter
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: audio-relay-android
          path: audio_relay_flutter/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      - name: Build Windows
        working-directory: audio_relay_flutter
        run: |
          flutter pub get
          flutter build windows --release
          powershell -Command "Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath 'audio-relay-windows.zip' -Force"
      - uses: actions/upload-artifact@v4
        with:
          name: audio-relay-windows
          path: audio_relay_flutter/audio-relay-windows.zip

  build-macos-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build macOS
        working-directory: audio_relay_flutter
        run: |
          flutter build macos --release
          cd build/macos/Build/Products/Release
          zip -r -q ../../../../../audio-relay-macos.zip audio_relay_flutter.app
          cd ../../../../../
      - name: Build iOS
        working-directory: audio_relay_flutter
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -r -q ../../audio-relay-ios.ipa Payload
          cd ../../
      - uses: actions/upload-artifact@v4
        with:
          name: audio-relay-macos
          path: audio_relay_flutter/audio-relay-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: audio-relay-ios
          path: audio_relay_flutter/audio-relay-ios.ipa
