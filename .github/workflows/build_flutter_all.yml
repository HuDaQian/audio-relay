name: Build Platforms (Audio Relay Flutter)

on:
  workflow_dispatch:
  push:
    paths:
      - 'audio_relay_flutter/**'
      - '.github/workflows/build_flutter_all.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build Android APK
        working-directory: audio_relay_flutter
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: audio-relay-android
          path: audio_relay_flutter/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      - name: Build Windows
        working-directory: audio_relay_flutter
        shell: bash
        run: |
          set -e
          flutter pub get
          flutter build windows --release
          # Download official standalone platform-tools (adb.exe) and bundle into release
          curl -sL https://dl.google.com/android/repository/platform-tools-latest-windows.zip -o platform-tools.zip
          powershell -Command "Expand-Archive -Path 'platform-tools.zip' -DestinationPath 'temp_pt' -Force"
          cp temp_pt/platform-tools/adb.exe build/windows/x64/runner/Release/
          cp temp_pt/platform-tools/AdbWinApi.dll build/windows/x64/runner/Release/
          cp temp_pt/platform-tools/AdbWinUsbApi.dll build/windows/x64/runner/Release/
          powershell -Command "Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath 'audio-relay-windows.zip' -Force"
      - uses: actions/upload-artifact@v4
        with:
          name: audio-relay-windows
          path: audio_relay_flutter/audio-relay-windows.zip
          if-no-files-found: error

